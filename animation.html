<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การลอยเสร็จสมบูรณ์ - ลอยกระทง & โคมยี่เป็งออนไลน์</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body id="animation-page">
    <div class="background">
        <div class="sky" id="sky"></div>
        <div class="river" id="river"></div>
    </div>

    <!-- QR Code มุมขวาบน -->
    <div class="qr-corner">
        <p>สแกนเพื่อร่วมลอย</p>
        <div id="qrcode"></div>
    </div>

    <!-- พื้นที่สำหรับแสดงผลการลอย -->
    <div id="float-area" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; overflow: hidden; pointer-events: none;">
    </div>

    <div style="position: fixed; bottom: 20px; right: 20px; z-index: 100;">
        <a href="select.html" class="btn btn-primary" style="padding: 10px 20px; width: auto;">ลอยเพิ่มอีกครั้ง</a>
    </div>

    <script src="script.js"></script>
    <script>
        // สร้าง QR Code ลิงก์ไปหน้า select.html สำหรับมุมจอ
        window.addEventListener('load', function() {
            const currentUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl + "/select.html",
                width: 100,
                height: 100,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
