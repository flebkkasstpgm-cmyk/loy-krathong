<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลอยกระทง & โคมยี่เป็งออนไลน์</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="background">
        <div class="sky" id="sky"></div>
        <div class="river" id="river"></div>
    </div>

    <div class="container">
        <h1>ลอยกระทง & โคมยี่เป็ง<br>ออนไลน์</h1>
        <p style="margin-bottom: 1rem;">สแกนเพื่อเริ่มลอย</p>
        <div class="qr-box" id="qrcode"></div>
        <p style="font-size: 0.8rem; opacity: 0.8; margin-top: 10px;">หรือคลิกปุ่มด้านล่าง</p>
        <a href="select.html" class="btn btn-primary">เข้าสู่เว็บไซต์</a>
    </div>

    <script src="script.js"></script>
    <script>
        // สร้าง QR Code ลิงก์ไปหน้า select.html
        window.onload = function() {
            const currentUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl + "/select.html",
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        };
    </script>
</body>
</html>
