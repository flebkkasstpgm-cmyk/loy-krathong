<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูล - ลอยกระทง & โคมยี่เป็งออนไลน์</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body id="form-page">
    <div class="background">
        <div class="sky" id="sky"></div>
        <div class="river" id="river"></div>
    </div>

    <div class="container form-container" style="width: 450px;">
        <h1 id="form-title">กิจกรรม</h1>
        
        <p>เลือกรูปแบบ:</p>
        <div class="design-grid" id="design-container">
            <!-- ดีไซน์จะถูกใส่ผ่าน JS -->
        </div>

        <!-- กล่องอัปโหลดรูปภาพสำหรับกระทงรูปถ่าย -->
        <div id="photo-upload-container" style="display: none;">
            <p style="font-size: 0.9rem; color: var(--gold); margin-bottom: 8px;">📷 อัปโหลดรูปภาพของคุณ (ย่อขนาดอัตโนมัติ)</p>
            <input type="file" id="user-photo-input" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
            <button type="button" class="btn" style="background: rgba(255,255,255,0.15); color: white; padding: 8px 15px; font-size: 0.9rem; display: inline-block; width: auto; border: 1px solid var(--gold); margin-bottom: 6px;" onclick="document.getElementById('user-photo-input').click()">
                📁 เลือกรูปถ่าย / ถ่ายเซลฟี่
            </button>
            <div id="photo-preview-wrap" style="display: none;">
                <div class="photo-preview-box">
                    <span class="preview-candle">🪔</span>
                    <img id="photo-preview-img" src="" alt="ตัวอย่างกระทงรูปถ่าย">
                </div>
                <span id="photo-size-text" style="font-size: 0.75rem; color: #a0aec0;">✨ ปรับขนาดพอดีกับกระทงเรียบร้อย</span>
            </div>
        </div>

        <input type="text" id="user-name" placeholder="ชื่อของคุณ" maxlength="20" required>
        <textarea id="user-msg" placeholder="คำอธิษฐานของคุณ" rows="3" maxlength="100" required></textarea>

        <button class="btn btn-primary" onclick="startFloating()">✨ เริ่มลอย ✨</button>
        <a href="select.html" style="color: white; font-size: 0.9rem; text-decoration: none; margin-top: 10px; display: inline-block;">ย้อนกลับ</a>
    </div>

    <script src="script.js"></script>
    <script>
        // จัดการหน้าฟอร์ม
        document.addEventListener('DOMContentLoaded', initForm);
    </script>
</body>
</html>
